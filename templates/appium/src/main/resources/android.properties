# Placeholder. Thay bằng giá trị thật hoặc override bằng -D<key>=<value>. Không commit secret.
appium.server=http://127.0.0.1:4723
device.name=<ANDROID_DEVICE_NAME>
platform.version=<ANDROID_VERSION>
# udid chỉ cần khi chạy device thật hoặc nhiều device (xem: adb devices). Để trống nếu không dùng.
udid=
app.path=<PATH_TO_APK>
app.package=<APP_PACKAGE>
app.activity=<APP_ACTIVITY>
wait.timeout.seconds=15
# Timeout khởi động UiAutomator2 server và lệnh adb (emulator chậm/host bận cần lớn hơn mặc định 30s/20s)
uia2.launch.timeout.seconds=90
adb.exec.timeout.seconds=60
